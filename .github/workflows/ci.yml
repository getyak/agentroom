name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # v0.1 has no end-to-end encryption, so mautrix is built without libolm (-tags nocrypto).
      # The integration tests need the local stack and skip themselves here (AGENTSTUDIO_IT unset).
      - run: go vet -tags nocrypto ./...
      - run: go test -tags nocrypto ./...

  typescript:
    name: TypeScript (typecheck, unit tests)
    runs-on: ubuntu-latest
    env:
      # Unit tests don't start Electron; skip downloading it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentstudio/core build
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @agentstudio/personal build
      - run: pnpm --filter @agentstudio/desktop build
      - name: Check copied desktop utility modules load
        run: node --input-type=module -e 'await import("./apps/desktop/out/main/personal/index.mjs")'
      - run: pnpm run test:dev
      - run: pnpm -r --if-present test
      - name: Install browser for personal workspace acceptance
        # Hosted Ubuntu already supplies the Chromium runtime libraries. Avoid
        # making every browser check depend on extra-font apt mirror availability.
        run: pnpm --filter @agentstudio/desktop exec playwright install chromium
      - name: Check the complete personal workspace journey
        shell: bash
        run: |
          node dev/personal-qa.mjs > "$RUNNER_TEMP/personal-qa.log" 2>&1 &
          personal_qa_pid=$!
          trap 'kill "$personal_qa_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e '
            for (let attempt = 0; attempt < 100; attempt++) {
              try { if ((await fetch("http://127.0.0.1:18745/api/health")).ok) process.exit(0); } catch {}
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            process.exit(1);
          '
          node dev/personal-browser.mjs
          node dev/personal-browser.mjs edges
          node dev/messenger-acceptance.mjs
          node dev/contact-names-acceptance.mjs
          node dev/agentroom-acceptance.mjs
          node dev/agent-onboarding-acceptance.mjs
          node dev/contact-picker-acceptance.mjs
          node dev/group-im-acceptance.mjs
          node dev/group-avatar-acceptance.mjs
          node dev/agent-profile-ui-acceptance.mjs
          AGENTROOM_CARDS_EVIDENCE_DIR=output/playwright/local-agent-cards node dev/local-agent-cards-acceptance.mjs
          node dev/platform-agent-cards-acceptance.mjs
          node dev/chat-tools-acceptance.mjs
          node dev/cc-switch-acceptance.mjs
          AGENTROOM_EVIDENCE_DIR=output/playwright/integrated-groups node dev/integrated-groups-acceptance.mjs
          ROOMIE_EVIDENCE_DIR=output/playwright/roomie node dev/roomie-acceptance.mjs
          node dev/conversation-acceptance.mjs
          node dev/decisions-acceptance.mjs
          node dev/mcp-access-acceptance.mjs
          node dev/live-conversation-acceptance.mjs
          node dev/macos-design-acceptance.mjs
          node dev/peer-devices-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-browser-evidence
          path: |
            output/playwright/personal/
            output/playwright/messenger/
            output/playwright/contact-names/
            output/playwright/agentroom/
            output/playwright/agent-onboarding/
            output/playwright/contact-picker/
            output/playwright/group-im/
            output/playwright/group-avatars/
            output/playwright/agent-profile-ui/
            output/playwright/local-agent-cards/
            output/playwright/platform-agent-cards/
            output/playwright/cc-switch/
            output/playwright/roomie/
            output/playwright/integrated-groups/
            output/playwright/conversations/
            output/playwright/decisions/
            output/playwright/mcp-access/
            output/playwright/live-conversations/
            output/playwright/macos-design/
            output/playwright/peer-devices/
          if-no-files-found: ignore
